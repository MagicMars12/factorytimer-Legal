<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory Timer</title>
<style>
:root{--bg:#f6f7fb;--card:#ffffff;--fg:#1d2330;--muted:#5b6475;--line:#e3e6ec;--accent:#5865f2;--accent-soft:#e9ebff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1117;--card:#171a23;--fg:#e6e9f0;--muted:#9aa3b5;--line:#272c39;--accent:#8c96ff;--accent-soft:#222645}}
*{box-sizing:border-box}
html{background:var(--bg);scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
header.bar div{max-width:1040px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font-weight:800;font-size:1.15rem;letter-spacing:.2px}
.brand b{color:var(--accent)}
header.bar nav a{color:var(--muted);text-decoration:none;margin-left:18px;font-weight:600;font-size:.95rem}
header.bar nav a:hover,header.bar nav a.on{color:var(--accent)}
.hero{max-width:1040px;margin:0 auto;padding:44px 20px 8px}
.hero h1{font-size:2.3rem;line-height:1.2;margin:0 0 12px}
.pill{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 12px;font-size:.85rem;font-weight:700}
.hero p{color:var(--muted);max-width:720px;margin:16px 0 0}
.wrap{max-width:1040px;margin:0 auto;padding:24px 20px 64px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:32px;align-items:start}
.toc{position:sticky;top:84px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.toc p{margin:0 0 8px;font-weight:800;font-size:.8rem;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.toc ol{margin:0;padding-left:20px}
.toc li{margin:5px 0;font-size:.93rem}
.toc a{color:var(--fg);text-decoration:none}
.toc a:hover{color:var(--accent)}
section{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 26px;margin:0 0 16px}
h2{font-size:1.2rem;margin:0 0 12px;display:flex;align-items:center;gap:12px}
.num{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;font-size:.95rem}
p,li{margin:0 0 10px}
section p:last-child,section ul:last-child{margin-bottom:0}
ul{padding-left:22px;margin:0 0 12px}
a{color:var(--accent)}
code{background:var(--accent-soft);color:var(--accent);padding:1px 6px;border-radius:6px;font-size:.92em}
footer{max-width:1040px;margin:0 auto;padding:0 20px 40px;color:var(--muted);font-size:.9rem}
footer a{color:var(--muted)}
@media (max-width:820px){.wrap{grid-template-columns:1fr}.toc{position:static}.hero h1{font-size:1.8rem}section{padding:18px}}
</style></head><body>
<header class="bar"><div><span class="brand">Factory <b>Timer</b></span><nav><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></nav></div></header>
<div class="hero"><h1>Factory Timer</h1><p>A Minecraft mod and Discord bot that tracks the health and stop times of your CivMC factories.</p></div>
<div class="wrap" style="grid-template-columns:1fr"><main>
<section><h2>Legal</h2><ul><li><a href="privacy.html">Privacy Policy</a></li><li><a href="terms.html">Terms of Service</a></li></ul></section>
</main></div>
<footer>Factory Timer &middot; <a href="privacy.html">Privacy Policy</a> &middot; <a href="terms.html">Terms of Service</a></footer>
</body></html>
